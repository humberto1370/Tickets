<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Tickets CRUD - Final</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 20px; background: #f0f2f5; color: #333; }
        .container { display: flex; gap: 20px; }
        section { background: white; padding: 20px; border-radius: 10px; flex: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #007bff; border-bottom: 2px solid #eef0f2; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .ticket-box { background: #fffde7; padding: 15px; border: 1px solid #fff59d; border-radius: 5px; margin-top: 10px; }
        button { cursor: pointer; padding: 8px 12px; border: none; border-radius: 4px; transition: 0.3s; }
        .btn-save { background: #28a745; color: white; }
        .btn-save:hover { background: #218838; }
        .btn-ticket { background: #007bff; color: white; width: 100%; font-weight: bold; margin-top: 10px; height: 40px; }
        .btn-del { background: #dc3545; color: white; font-size: 12px; }
        #lista-carrito { padding: 0; }
        .carrito-item { list-style: none; display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #ccc; }
    </style>
</head>
<body>

    <h1 style="text-align: center;">🎟️ Sistema de Punto de Venta</h1>

    <div class="container">
        <!-- SECCIÓN DE PRODUCTOS -->
        <section>
            <h2>📦 Inventario (Productos)</h2>
            <form id="form-producto" style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="p-nombre" placeholder="Nombre" required style="flex: 2; padding: 8px;">
                <input type="number" id="p-precio" placeholder="Precio" step="0.01" required style="flex: 1; padding: 8px;">
                <button type="submit" class="btn-save">Añadir</button>
            </form>
            <table>
                <thead>
                    <tr><th>Producto</th><th>Precio</th><th>Acción</th></tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </section>

        <!-- SECCIÓN DE VENTAS -->
        <section>
            <h2>🛒 Generar Ticket</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <select id="select-productos" style="flex: 2; padding: 8px;"></select>
                <input type="number" id="v-cantidad" value="1" min="1" style="width: 50px; padding: 8px;">
                <button id="btn-agregar-carrito" style="background: #6c757d; color: white; font-weight: bold;">+</button>
            </div>

            <div class="ticket-box">
                <p style="text-align: center; font-weight: bold; margin-bottom: 5px;">TICKET ACTUAL</p>
                <ul id="lista-carrito"></ul>
                <hr>
                <p style="display: flex; justify-content: space-between; font-size: 1.2em;">
                    <span>Total:</span> <strong>$<span id="total-ticket">0.00</span></strong>
                </p>
            </div>
            <button id="btn-finalizar-venta" class="btn-ticket">REGISTRAR VENTA</button>
        </section>
    </div>

    <!-- SECCIÓN DE HISTORIAL -->
    <section>
        <h2>📄 Historial de Tickets (Ventas Realizadas)</h2>
        <table>
            <thead>
                <tr>
                    <th>ID Venta</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-ventas"></tbody>
        </table>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
