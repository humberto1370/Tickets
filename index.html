<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tickets CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎟️ Sistema de Tickets de Venta</h1>

        <!-- SECCIÓN: GESTIÓN DE PRODUCTOS -->
        <section class="card">
            <h2>📦 Registrar Nuevo Producto</h2>
            <div class="form-group">
                <input type="text" id="prodNombre" placeholder="Nombre del producto">
                <input type="number" id="prodPrecio" placeholder="Precio ($)">
                <button class="btn-success" id="btnGuardarProducto">Guardar Producto</button>
            </div>
        </section>

        <!-- SECCIÓN: GENERAR VENTA -->
        <section class="card">
            <h2>🛒 Generar Ticket de Venta</h2>
            <div class="form-group">
                <select id="selectProducto">
                    <option value="">Cargando productos...</option>
                </select>
                <input type="number" id="cantidad" placeholder="Cantidad" min="1" value="1">
                <button class="btn-primary" id="btnFinalizarVenta">Finalizar Venta</button>
            </div>
        </section>

        <!-- SECCIÓN: HISTORIAL -->
        <section class="card">
            <h2>📄 Historial de Ventas (Tickets)</h2>
            <div id="listaVentas" class="grid-ventas">
                <!-- Aquí se cargarán los tickets desde Firebase -->
            </div>
        </section>
    </div>

    <!-- Firebase SDK y tu lógica -->
    <script type="module" src="app.js"></script>
</body>
</html>
